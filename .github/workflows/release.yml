# Builds a signed release for a version tag (made with `pnpm release <version>`) and publishes it
# with latest.json, which installed copies of the app check for updates. Both platforms land in
# the same release and the same latest.json.
#
# Run it by hand (Actions > Release > Run workflow) to build Windows only, as a draft release no
# installed copy sees: for trying a Windows build before it ships to everyone.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        # A tag builds both; a manual run builds Windows only. macOS is one app for Apple silicon
        # and Intel Macs.
        include: ${{ fromJSON(github.event_name == 'push' && '[{"os":"macos-latest","rust_targets":"aarch64-apple-darwin,x86_64-apple-darwin","args":"--target universal-apple-darwin --bundles app,dmg"},{"os":"windows-latest","rust_targets":"","args":"--bundles nsis"}]' || '[{"os":"windows-latest","rust_targets":"","args":"--bundles nsis"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm test

      # Signs the macOS app with Demian's own certificate (self-signed, so not Apple's), which lets
      # macOS keep the user's answers to its privacy prompts across updates. Tauri's own import
      # (APPLE_CERTIFICATE) only takes Apple certificates, so it goes in a keychain here and Tauri
      # gets just the identity's name. See scripts/signing-certificate.md.
      - name: Import the signing certificate
        if: runner.os == 'macOS'
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE" ]; then
            echo "No MACOS_CERTIFICATE secret: the app is signed ad hoc."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -f pkcs12 -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/signing.p12"
          security find-identity -p codesigning "$KEYCHAIN" | grep '"Demian Code Signing"' >/dev/null
          echo "APPLE_SIGNING_IDENTITY=Demian Code Signing" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event_name == 'push' && github.ref_name || format('windows-test-{0}', github.run_number) }}
          releaseName: ${{ github.event_name == 'push' && format('Demian {0}', github.ref_name) || format('Windows test build {0}', github.run_number) }}
          releaseBody: |
            **macOS:** open the `.dmg` and drag Demian into Applications. The app isn't signed by Apple yet, so before opening it the first time, open Terminal, paste this and press Return:

            ```bash
            xattr -dr com.apple.quarantine "/Applications/Demian.app"
            ```

            **Windows:** run the `-setup.exe`. If SmartScreen warns you, choose **More info**, then **Run anyway**.

            On first launch, Demian walks you through installing Claude Code, signing it in and connecting your accounts. See the [README](https://github.com/jonathantcallahan/orb-sees-all#readme) for the details.
          releaseDraft: ${{ github.event_name != 'push' }}
          args: ${{ matrix.args }}
