# Builds a signed release for a version tag (made with `pnpm release <version>`) and publishes it
# with latest.json, which installed copies of the app check for updates. Both platforms land in
# the same release and the same latest.json.
#
# Run it by hand (Actions > Release > Run workflow) to build Windows only, as a draft release no
# installed copy sees: for trying a Windows build before it ships to everyone.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        # A tag builds both; a manual run builds Windows only. macOS is one app for Apple silicon
        # and Intel Macs.
        include: ${{ fromJSON(github.event_name == 'push' && '[{"os":"macos-latest","rust_targets":"aarch64-apple-darwin,x86_64-apple-darwin","args":"--target universal-apple-darwin --bundles app,dmg"},{"os":"windows-latest","rust_targets":"","args":"--bundles nsis"}]' || '[{"os":"windows-latest","rust_targets":"","args":"--bundles nsis"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event_name == 'push' && github.ref_name || format('windows-test-{0}', github.run_number) }}
          releaseName: ${{ github.event_name == 'push' && format('Demian {0}', github.ref_name) || format('Windows test build {0}', github.run_number) }}
          releaseBody: "See the README for setup. First launch on a new Mac: right-click the app and choose Open. On Windows: if SmartScreen warns you, choose More info, then Run anyway."
          releaseDraft: ${{ github.event_name != 'push' }}
          args: ${{ matrix.args }}
